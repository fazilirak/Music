name: Model F and F EQ Windows and macOS Release
on:
  push:
    branches: [main]
    paths: ['Model-F/**', 'F-EQ/**', 'scripts/rust_audio_release.py', '.github/workflows/rust-audio-release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-audio-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        project: [Model-F, F-EQ]
        include:
          - os: windows-2022
            platform: Windows
          - os: macos-15
            platform: macOS
        os: [windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install both Mac target libraries
        if: runner.os == 'macOS'
        run: rustup target add --toolchain 1.97.1 aarch64-apple-darwin x86_64-apple-darwin
      - name: Test, build, package complete matching sources
        run: python scripts/rust_audio_release.py ${{ matrix.project }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.project }}-${{ matrix.platform }}
          path: |
            ${{ matrix.project }}/release-dist/*.zip
            ${{ matrix.project }}/release-dist/*.tar.gz
            ${{ matrix.project }}/release-dist/*-MANIFEST.json
          if-no-files-found: error
          compression-level: 0
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: '*-Windows'
          path: artifacts/windows
      - uses: actions/download-artifact@v7
        with:
          pattern: '*-macOS'
          path: artifacts/macos
      - name: Publish corresponding source alongside tested binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for project in Model-F F-EQ; do
            win="artifacts/windows/${project}-Windows"
            mac="artifacts/macos/${project}-macOS"
            version=$(python -c "import json;print(json.load(open('$win/$project-Windows-MANIFEST.json'))['version'])")
            tag="${project}-v${version}"
            cat > release-notes.md <<'NOTES'
          Existing Rust/NIH-plug edition. Windows x64: VST3, CLAP, standalone EXE.
          macOS Universal arm64+x86_64: VST3, CLAP, standalone APP; macOS 11+.
          AU is not included. Mac bundles are ad-hoc signed, not Developer ID signed or Apple notarised.

          Both build hosts passed the product's automated tests; separate real DAW and Intel/Apple Silicon hardware validation remains necessary.
          Project code is GPL-3.0-or-later. Original third-party copyrights and licences are preserved, including the URW Gothic AGPLv3 font terms and F EQ Luftikus MIT notice.
          Complete matching Source ZIPs include project sources, locked vendored dependencies, original font source collection, tests, build scripts and licences. Keep the corresponding source available when redistributing covered binaries.
          No JUCE rewrite is included. Plugin identities and DSP are preserved; Model F enables preset/envelope file dialogs on macOS.
          NOTES
            if [ "$project" = "Model-F" ]; then
              cat >> release-notes.md <<'MODEL'

          Model F 0.2.6
          - Adds a thin orange high-resonance arc and scale marks around Emphasis, with a different starting point for each of the six characters. It is an advisory region, not a limiter or universal safety threshold. Panel and knob sizes are unchanged.
          - Corrects Acid's nonlinear ladder feedback calculation: the per-stage extra small-signal gain that caused premature oscillation near Emphasis 7.7-7.8 has been removed. The upper-quarter control curve approaches maximum resonance more gently, with 20 ms smoothing for live changes.
          - Acid Emphasis dragging is 2.5x finer. Wheel steps are 0.05, or 0.01 with Shift. Parameter IDs, automation values and preset data remain unchanged; the corrected Acid filter can sound different. Other character DSP paths are unchanged.
          - At 48 kHz with a specified small sine input and 0.1 Emphasis steps, the largest adjacent RMS rises at cutoff 100/500/2000 Hz changed from 7.95/25.74/45.57 dB to 1.80/2.05/2.04 dB. See docs/REZONANS-026-TR.md for scope and reproducible regression checks; these are not absolute output-level guarantees.
          - Retains all 0.2.5 features: Ladder, Edge, Bite, State Variable, Acid, VA Stack; preset-independent Global Tuning; the mouse hit-area fix; 160 presets; dual oscillators; Sync/FM; Filter/Audio envelopes; Multi tempo controls; native Windows Save/Search and macOS file dialogs.

          Local Windows validation: 67 product unit tests, 8 character/audio tests, 4 CLAP host tests, 1 audio-allocation test and 5 core character tests passed (85 total). CI runs the full product suite and core checks on both hosts. Real DAW and macOS hardware validation remains separate.
          Complete matching sources retain licences, updated UI previews, character audition WAVs and measurement notes.
          MODEL
            fi
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Existing $tag preserved; use a new version to replace a published build."
              continue
            fi
            gh release create "$tag" \
              "$win/${project}-${version}-Windows-x64.zip" \
              "$win/${project}-${version}-Windows-Source.zip" \
              "$mac/${project}-${version}-macOS-Universal.tar.gz" \
              "$mac/${project}-${version}-macOS-Source.zip" \
              "$win/${project}-Windows-MANIFEST.json" "$mac/${project}-macOS-MANIFEST.json" \
              --target "$BUILD_COMMIT" --title "${project} ${version}" --notes-file release-notes.md
          done

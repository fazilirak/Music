# Fazıl Irak | F-Kick ve F-TransForm için yerel macOS derleme ve yayın akışı.
# SPDX-License-Identifier: AGPL-3.0-or-later
name: F-Kick and F-TransForm macOS Universal
on:
  push:
    branches: [main]
    paths:
      - 'F-Kick/**'
      - 'F-TransForm/**'
      - 'scripts/package_originals_macos.py'
      - '.github/workflows/f-originals-macos.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: f-originals-macos-${{ github.ref }}
  cancel-in-progress: false
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        project: [F-Kick, F-TransForm]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install build tools and verify pinned sources
        run: |
          python -m pip install 'cmake>=3.24,<4' ninja
          python scripts/bootstrap_juce.py
          if [ -f scripts/bootstrap_fonts.py ]; then python scripts/bootstrap_fonts.py; fi
      - name: Build Universal VST3, AU and standalone
        run: |
          cmake -S . -B build-macos -G Ninja -DCMAKE_BUILD_TYPE=Release '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build-macos --parallel 3
      - name: Run DSP, state, GUI and available host checks
        run: ctest --test-dir build-macos --output-on-failure --timeout 600
      - name: Verify architectures, sign and package with complete source
        run: python ../scripts/package_originals_macos.py .
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.project }}-macOS
          path: ${{ matrix.project }}/dist/macos-release/*
          if-no-files-found: error
          compression-level: 0
      - name: Retain test evidence and interface snapshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.project }}-macOS-checks
          path: |
            ${{ matrix.project }}/build-macos/Testing/Temporary/*.log
            ${{ matrix.project }}/build-macos/CMakeFiles/CMakeConfigureLog.yaml
            ${{ matrix.project }}/validation/*.png
            ${{ matrix.project }}/dist/*.png
          if-no-files-found: ignore
  release:
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        project: [F-Kick, F-TransForm]
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.project }}-macOS
          path: release
      - name: Add tested Mac assets to the matching existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PROJECT: ${{ matrix.project }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'import json;print(json.load(open("release/macOS-RELEASE-MANIFEST.json"))["version"])')
          tag="${RELEASE_PROJECT}-v${version}"
          gh release view "$tag" >/dev/null
          for file in release/*; do
            name=$(basename "$file")
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              echo "Preserving existing asset: $name"
            else
              gh release upload "$tag" "$file"
            fi
          done
          gh release view "$tag" --json body --jq .body > notes.md
          python - <<'PY'
          from pathlib import Path
          path = Path('notes.md')
          text = path.read_text()
          text = text.replace('macOS is not included in this release. ', '')
          heading = '### macOS Universal added'
          if heading not in text:
              text += '\n\n' + heading + '\n\nNative macOS build: VST3, AU and standalone for Apple Silicon + Intel; macOS 11.0+. DSP/state/GUI CTest passed on the macOS CI host. All bundle versions, both Mach-O architectures and ad-hoc signatures were verified. Physical Intel Mac and third-party DAW testing remain separate.\n\nMac bundles are ad-hoc signed, not Developer ID signed or Apple notarised. The matching macOS Source ZIP includes complete pinned JUCE sources, applicable font sources, tests, build instructions and preserved licence notices. SHA-256 values and build provenance are in macOS-RELEASE-MANIFEST.json. Existing Windows/Linux assets are preserved.\n'
          path.write_text(text)
          PY
          gh release edit "$tag" --notes-file notes.md

# Fazıl Irak — release withdrawn at owner's request.
name: Withdraw F-EQ Pro public release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/feq-pro-publish.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  withdraw:
    runs-on: ubuntu-24.04
    steps:
      - name: Remove withdrawn release and its tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view F-EQ-Pro-v0.6.0 >/dev/null 2>&1; then
            gh release delete F-EQ-Pro-v0.6.0 --yes --cleanup-tag
          fi

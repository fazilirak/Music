name: Shaper Windows and macOS Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shaper-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install 'cmake>=3.24,<4' ninja
      - name: Read version
        id: version
        shell: python
        run: |
          import os, pathlib, re
          version = re.search(r'project\(Shaper VERSION ([\d.]+)', pathlib.Path('CMakeLists.txt').read_text())[1]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + version + '\n')
      - name: Build and test Windows
        shell: cmd
        run: scripts\build-windows.cmd
      - name: Package Windows and source
        run: python scripts/package_distribution.py
      - uses: actions/upload-artifact@v7
        with:
          name: Shaper-Windows
          path: dist/Shaper-*-distribution/*
          if-no-files-found: error
          compression-level: 0
      - name: Upload Windows diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Shaper-Windows-diagnostics
          path: build/Testing/Temporary/*.log
          if-no-files-found: ignore

  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python3 -m pip install 'cmake>=3.24,<4' ninja
      - name: Build, test and package Mac Universal
        run: bash scripts/build-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Shaper-macOS
          path: dist/Shaper-*-macOS-distribution/*
          if-no-files-found: error
          compression-level: 0
      - name: Upload Mac diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Shaper-macOS-diagnostics
          path: |
            build-macos/Testing/Temporary/*.log
            build-macos/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: Shaper-Windows
          path: artifacts/windows
      - uses: actions/download-artifact@v7
        with:
          name: Shaper-macOS
          path: artifacts/macos
      - name: Publish matching binaries and corresponding source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHAPER_VERSION: ${{ needs.windows.outputs.version }}
          SHAPER_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          cp artifacts/windows/*-Source.zip release/
          cp artifacts/windows/*-Windows-x64.zip release/
          cp artifacts/macos/*-macOS-Universal.tar.gz release/
          cp artifacts/macos/*-macOS-Source.zip release/
          cp artifacts/windows/RELEASE-MANIFEST.json release/Windows-RELEASE-MANIFEST.json
          cp artifacts/macos/RELEASE-MANIFEST.json release/macOS-RELEASE-MANIFEST.json
          cat > release-notes.md <<'NOTES'
          Windows x64: VST3 and standalone.
          macOS Universal (arm64 + x86_64): VST3, AU and standalone; deployment target macOS 11.0.

          Mac bundles are ad-hoc signed; they are not Developer ID signed or Apple notarised.
          Both build hosts passed all four CTest targets. Separate DAW and Intel Mac testing is still required.
          The Source ZIP includes Shaper, preserved upstream sources, build scripts and licence notices.
          Distribute the matching source alongside binaries. Individual component licences are preserved.
          The default Reverb IR is independently generated; the former Samplicity resource is excluded.
          NOTES
          tag="Shaper-v${SHAPER_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; use a new Shaper version for a new published build." >&2
            exit 1
          fi
          gh release create "$tag" release/* --target "$SHAPER_COMMIT" \
            --title "Shaper ${SHAPER_VERSION}" --notes-file release-notes.md

# Türkçe bakım açıklamaları: Fazıl Irak
# Son düzenleme: 22.10.2026
# Görev: Bu projenin derleme/parametre/araç yapılandırmasıdır; bağımlılık ve sürüm sözleşmesini birlikte koruyun.
[package]
name = "model-f-core"
description = "Real-time models of the Minimoog Model D's circuits, derived from and tested against the circuit lab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Per-part timing for `model-f-core-lab perf` (off: the laps compile to nothing).
profile = []
# `ulp::set` moves the elementary functions' results by an ulp (a render's twins).
twins = []
# `ulp::calls` counts the elementary functions' calls by their call site.
count = []

[dependencies]
libm.workspace = true

[dev-dependencies]
model-f-rt.workspace = true

[lints]
workspace = true

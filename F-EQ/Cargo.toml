# Türkçe bakım açıklamaları: Fazıl Irak
# Son düzenleme: 22.10.2026
# Görev: Bu projenin derleme/parametre/araç yapılandırmasıdır; bağımlılık ve sürüm sözleşmesini birlikte koruyun.
[package]
name = "simple-eq"
version = "0.1.11"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
standalone = ["nih_plug/standalone"]

[[example]]
name = "simple-eq"
path = "examples/standalone.rs"
required-features = ["standalone"]

[dependencies]
nih_plug = { path = "third_party/nih-plug" }
baseview = { path = "third_party/baseview" }
softbuffer = { version = "0.4.6", default-features = false, features = ["kms", "x11"] }
raw-window-handle = "0.5"
raw-window-handle-06 = { package = "raw-window-handle", version = "0.6" }
keyboard-types = { version = "0.6.1", default-features = false }
resvg = { version = "0.45", default-features = false, features = ["text", "raster-images"] }

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3.9", features = ["winuser", "windef"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11 = { version = "2.21", features = ["xlib"] }

[dev-dependencies]
clap-sys = { path = "third_party/clap-sys" }

[profile.release]
debug = 0

[workspace]
exclude = ["third_party"]

